name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ccs
            asset_name: cloud-cost-saver-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ccs
            asset_name: cloud-cost-saver-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ccs
            asset_name: cloud-cost-saver-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ccs.exe
            asset_name: cloud-cost-saver-windows-amd64.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset_name }}
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
